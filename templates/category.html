<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ site_description }}">
    <link rel="canonical" href="https://{{ site_domain }}/categories/{{ category|lower|replace(' ', '-') }}.html">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="container nav-container">
            <a href="/" class="logo">{{ site_name }}</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container main-content">
        <section class="category-header">
            <h1>{{ category }}</h1>
            <p>{{ articles|length }} articles in this category</p>
        </section>
        
        <div class="category-articles">
            {% for article in articles %}
            <article class="article-list-item">
                <h3><a href="/posts/{{ article.slug }}.html">{{ article.title }}</a></h3>
                <div class="list-meta">
                    <span>{{ article.published_at[:10] }}</span>
                    <span>{{ article.estimated_read_time }} min read</span>
                </div>
            </article>
            {% endfor %}
        </div>
    </main>
    
    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ current_year }} {{ site_name }}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
